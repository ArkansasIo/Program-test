appId: com.arkansasio.crisperstudio
productName: CRISPER Studio
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
