name: CRISPER Studio CI
on:
  push:
    paths:
      - 'projects/crisper-studio/**'
      - '.github/workflows/crisper-studio.yml'
  pull_request:
    paths:
      - 'projects/crisper-studio/**'
      - '.github/workflows/crisper-studio.yml'
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/crisper-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
